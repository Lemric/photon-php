# PHP 8.6 series (release candidate) — see 85.conf for field meanings.
# RC tarballs are not published under www.php.net/distributions, so the tag is
# fetched from GitHub. For the final release switch PHP_PRERELEASE to empty and
# PHP_SRCURL/PHP_SRCDIR to the php.net values from 85.conf.
PHP_MAJOR=86
PHP_BRANCH=8.6
PHP_VERSION=8.6.0
PHP_PRERELEASE=RC4
PHP_SRCURL="https://github.com/php/php-src/archive/php-%{php_srcver}/php-%{php_srcver}.tar.gz"
PHP_SRCDIR="php-src-php-%{php_srcver}"
PHP_CONFLICTS="php85"
